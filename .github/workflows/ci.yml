name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validation & security/swarm tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax checks
        run: |
          for f in *.js; do node --check "$f"; done

      - name: Run engine validation
        run: node validate.js

      - name: Run security and swarm unit tests
        run: node --test test_llm_security.js test_swarm_orchestrator.js
